packages:
  - packages/*
  - apps/*
  - test/with-anvil
  - test/mock-game-contracts
  - test/puppet-modules
  - test/system-libraries
  - test/ts-benchmarks
packageManagerStrict: false
# pnpm 10 reset the default `publicHoistPattern` to `[]`. Restore the pnpm 9
# default so the root `pnpm lint` can still resolve workspace-owned plugins
# like @ianvs/prettier-plugin-sort-imports (referenced from explorer's
# .prettierrc.cjs) when prettier runs from the repo root.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
allowBuilds:
  '@foundry-rs/anvil': true
  '@foundry-rs/chisel': true
  '@foundry-rs/forge': true
  '@sentry/profiling-node': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  keccak: true
  utf-8-validate: true
